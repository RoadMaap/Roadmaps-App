<!doctype html>
<html lang="fa" dir="rtl" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/icons/app.ico?v=3" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trading App</title>
    <script>
      try {
        const savedLanguage = localStorage.getItem('app_lang');
        if (savedLanguage === 'fa' || savedLanguage === 'en') {
          document.documentElement.lang = savedLanguage;
          document.documentElement.dir = savedLanguage === 'fa' ? 'rtl' : 'ltr';
        }
      } catch {}
    </script>
    <script type="text/javascript" src="eel.js"></script>
  </head>
  <body class="bg-[var(--bg-page)] text-[var(--text-primary)] overflow-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
